name: Verify published evidence

on: [push, pull_request]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check raw hashes and derived tables
        run: python analysis/summarize.py --check
      - name: Test parsing, failure handling, and packet evidence
        run: python -m unittest discover -s tests -v
      - name: Check reconstructed shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
